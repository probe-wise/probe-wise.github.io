# Runs the same checks as `npm run lint`, `typecheck`, `test` and `build` locally.
# No secrets are needed: database tests run against PGlite (in-process Postgres),
# and the app builds without Supabase env vars.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
